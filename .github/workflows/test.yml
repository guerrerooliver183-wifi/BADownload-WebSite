name: Download Blue Archive assets via temporary browser link

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Server region: Global (GL), China (CN), or Japan (JP)"
        type: choice
        required: true
        default: jp
        options:
          - gl
          - cn
          - jp
      platform:
        description: "Platform"
        type: choice
        required: true
        default: windows
        options:
          - android
          - ios
          - windows
      resources:
        description: "Resource groups to download"
        type: choice
        required: true
        default: all
        options:
          - all
          - table,media
          - table
          - media
          - bundle

permissions:
  contents: read

concurrency:
  group: blue-archive-${{ inputs.region }}-download
  cancel-in-progress: false

jobs:
  download-and-serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout downloader
        uses: actions/checkout@v4
        with:
          repository: ZM-Kimu/Blue-Archive-Asset-Downloader
          submodules: recursive
          path: project

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install downloader dependencies
        working-directory: project
        run: uv sync

      - name: Check available disk space
        run: df -h /

      - name: Download resources
        working-directory: project
        env:
          RESOURCE_GROUPS: ${{ inputs.resources }}
          REGION: ${{ inputs.region }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -eu
          if [ "$REGION" != "jp" ] && [ "$PLATFORM" = "ios" ]; then
            echo "::error::The iOS platform is only supported for the JP region."
            exit 1
          fi
          if [ "$RESOURCE_GROUPS" = "all" ]; then
            uv run ba-downloader assets download --region "$REGION" --platform "$PLATFORM"
          else
            uv run ba-downloader assets download \
              --region "$REGION" \
              --platform "$PLATFORM" \
              --resources "$RESOURCE_GROUPS"
          fi
          test -d "$REGION/$PLATFORM/raw"
          du -sh "$REGION/$PLATFORM/raw"

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          7z | head -n 2

      - name: Prepare 7z archive with known size
        working-directory: project
        env:
          REGION: ${{ inputs.region }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -eu
          archive="$GITHUB_WORKSPACE/project/BlueArchive-$REGION-$PLATFORM.7z"
          cd "$GITHUB_WORKSPACE/project/$REGION/$PLATFORM"
          # Store without compression. -sdel removes each source file after it
          # is added, avoiding the need for a second full copy on disk.
          7z a -t7z -mx=0 -sdel "$archive" raw
          test -s "$archive"
          7z t "$archive"
          echo "Archive size: $(stat -c '%s bytes' "$archive")"
          ls -lh "$archive"
          echo "ARCHIVE_PATH=$archive" >> "$GITHUB_ENV"

      - name: Install cloudflared
        run: |
          set -eu
          curl --fail --silent --show-error --location \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start temporary archive endpoint and Quick Tunnel
        env:
          ARCHIVE_PATH: ${{ github.workspace }}/project/BlueArchive-${{ inputs.region }}-${{ inputs.platform }}.7z
          REGION: ${{ inputs.region }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -eu
          export DOWNLOAD_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          export ARCHIVE_PATH PLATFORM
          cat > /tmp/archive_server.py <<'PY'
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          archive_path = os.path.abspath(os.environ["ARCHIVE_PATH"])
          token = os.environ["DOWNLOAD_TOKEN"]
          region = os.environ["REGION"]
          platform = os.environ["PLATFORM"]
          filename = f"BlueArchive-{region}-{platform}.7z"
          expected_path = f"/{token}/{filename}"

          class Handler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.0"

              def send_archive_headers(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "application/x-7z-compressed")
                  self.send_header("Content-Disposition", f'attachment; filename="{filename}"')
                  self.send_header("Content-Length", str(os.path.getsize(archive_path)))
                  self.send_header("Cache-Control", "no-store")
                  self.send_header("Accept-Ranges", "none")
                  self.end_headers()

              def do_HEAD(self):
                  if self.path != expected_path or not os.path.isfile(archive_path):
                      self.send_error(404)
                      return
                  self.send_archive_headers()

              def do_GET(self):
                  if self.path != expected_path:
                      self.send_error(404)
                      return
                  if not os.path.isfile(archive_path):
                      self.send_error(404, "Archive not found")
                      return

                  self.send_archive_headers()
                  try:
                      with open(archive_path, "rb") as archive:
                          while True:
                              chunk = archive.read(1024 * 1024)
                              if not chunk:
                                  break
                              self.wfile.write(chunk)
                  except (BrokenPipeError, ConnectionResetError):
                      print("Client disconnected before download completed", flush=True)

              def log_message(self, fmt, *args):
                  print("%s - %s" % (self.client_address[0], fmt % args), flush=True)

          ThreadingHTTPServer(("127.0.0.1", 8765), Handler).serve_forever()
          PY

          nohup env DOWNLOAD_TOKEN="$DOWNLOAD_TOKEN" ARCHIVE_PATH="$ARCHIVE_PATH" REGION="$REGION" PLATFORM="$PLATFORM" \
            python3 -u /tmp/archive_server.py >/tmp/archive-server.log 2>&1 &
          echo "$!" > /tmp/archive-server.pid

          nohup cloudflared tunnel --url http://127.0.0.1:8765 --no-autoupdate --logfile /tmp/cloudflared.log >/dev/null 2>&1 &
          echo "$!" > /tmp/cloudflared.pid

          TUNNEL_URL=""
          for attempt in $(seq 1 60); do
            TUNNEL_URL="$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log 2>/dev/null | head -n 1 || true)"
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "::error::Cloudflare Quick Tunnel did not provide a URL."
            cat /tmp/cloudflared.log || true
            cat /tmp/archive-server.log || true
            exit 1
          fi

          DOWNLOAD_URL="$TUNNEL_URL/$DOWNLOAD_TOKEN/BlueArchive-$REGION-$PLATFORM.7z"
          {
            echo "## Blue Archive $REGION browser download"
            echo
            echo "Server region: $REGION"
          echo "Platform: $PLATFORM"
            echo
            echo "Open this temporary link in Chrome on Android:"
            echo
            echo "$DOWNLOAD_URL"
            echo
            echo "**Keep this Actions run active until the browser download finishes.** The link is public to anyone who obtains it while the tunnel is running."
            echo
            echo "The server sends the exact Content-Length so Chrome can display the total size. Interrupted downloads cannot be resumed. Ensure the phone has enough free space for the archive and extraction."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Temporary download URL: $DOWNLOAD_URL"
          echo "The tunnel is active. Keep this workflow running while downloading."
          echo "The job will stop automatically at its 350-minute timeout."
          sleep 340m

      - name: Report results
        if: always()
        working-directory: project
        env:
          REGION: ${{ inputs.region }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          echo "## Resource summary" >> "$GITHUB_STEP_SUMMARY"
          archive="BlueArchive-$REGION-$PLATFORM.7z"
          if [ -f "$archive" ]; then
            ls -lh "$archive" | tee -a "$GITHUB_STEP_SUMMARY"
            stat -c 'Archive size in bytes: %s' "$archive" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Archive was not created; inspect the download and archive steps." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"
